<!-- src/app/features/chef-comite/membres/chef-membres.component.html -->
<app-layout title="Membres du Comité" subtitle="Gérer les adhésions et l'équipe">

  <div class="section-head">
    <h3>Membres actifs <span class="count">{{ membres.length }}</span></h3>
  </div>

  <div class="membres-grid">
    <div class="membre-card" *ngFor="let m of membres">
      <div class="mc-avatar">{{ initials(m.nom) }}</div>
      <div class="mc-info">
        <div class="mc-nom">{{ m.nom }}</div>
        <div class="mc-email">{{ m.email }}</div>
      </div>
      <div class="mc-actions">
        <button class="action-btn delete" (click)="retirer(m.id)" title="Retirer du comité">✕</button>
      </div>
    </div>
    <div class="empty-membres" *ngIf="membres.length === 0">Aucun membre dans ce comité.</div>
  </div>

  <div class="section-head" style="margin-top:28px;">
    <h3>Demandes d'adhésion <span class="count amber">{{ demandesEnAttente.length }}</span></h3>
  </div>

  <div class="demandes-list">
    <div class="demande-card" *ngFor="let d of demandesEnAttente">
      <div class="dc-avatar">{{ d.nom[0] }}</div>
      <div class="dc-info">
        <div class="dc-nom">{{ d.nom }}</div>
        <div class="dc-email">{{ d.email }}</div>
      </div>
      <div class="dc-actions">
        <button class="btn btn-success btn-sm" (click)="accepter(d.id)">✅ Accepter</button>
        <button class="btn btn-danger  btn-sm" (click)="refuser(d.id)">❌ Refuser</button>
      </div>
    </div>
    <div class="empty-demandes" *ngIf="demandesEnAttente.length === 0">Aucune demande en attente.</div>
  </div>

</app-layout>
